<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="The encaustic bench in three depths: the leaning panel and wall still, one wax cake crossing from the cold corner to the heated centre and softening at its lower face while a pot surface levels and then cools dull, and the scraper lying flat and still in the near depth">
<rect width="1200" height="520" fill="#e9e2d0"/>
<polygon points="0,0 620,0 320,330 0,330" fill="#fffcf4" opacity="0.5"/>
<!-- far depth: panel leans, wall still, north light unchanged -->
<rect x="930" y="60" width="210" height="270" fill="#96744c"/>
<rect x="946" y="76" width="178" height="238" fill="#d4b888"/>
<rect x="962" y="92" width="146" height="52" fill="#26316e"/>
<rect x="962" y="156" width="146" height="52" fill="#b06634"/>
<rect x="962" y="220" width="146" height="52" fill="#f0ece0"/>
<line x1="962" y1="98" x2="1108" y2="91" stroke="#fffaf0" stroke-width="4"/>
<!-- bench -->
<rect y="330" width="1200" height="34" fill="#a48054"/>
<rect y="364" width="1200" height="156" fill="#7a5c38"/>
<!-- mid depth: the hot plate, cold corner and heated centre -->
<rect x="220" y="216" width="620" height="130" fill="#3a3634"/>
<rect x="220" y="216" width="200" height="130" fill="#686462"/>
<!-- one pot, already liquid: its surface levels, then cools and dulls ridge by ridge -->
<g>
<rect x="600" y="238" width="110" height="76" fill="#464240"/>
<ellipse cx="655" cy="238" rx="55" ry="16" fill="#26316e">
<animate attributeName="ry" values="20;14;14;14" keyTimes="0;0.25;0.6;1" dur="18s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="655" cy="236" rx="55" ry="10" fill="#ffffff" opacity="0.35">
<animate attributeName="opacity" values="0.35;0.3;0.12;0.02" keyTimes="0;0.3;0.7;1" dur="18s" repeatCount="indefinite"/>
</ellipse>
</g>
<!-- the cake crosses in stages from cold corner to heated centre; its lower face softens and a shine spreads and stops at its edges -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;120 0;120 0;230 0;230 0" keyTimes="0;0.2;0.38;0.55;0.72;1" dur="18s" repeatCount="indefinite"/>
<rect x="252" y="272" width="150" height="46" fill="#d0ac66"/>
<ellipse cx="327" cy="272" rx="75" ry="20" fill="#e2c482"/>
<rect x="252" y="296" width="150" height="22" fill="#eed090" opacity="0">
<animate attributeName="opacity" values="0;0;0;0.55;0.9;0.9" keyTimes="0;0.2;0.55;0.72;0.85;1" dur="18s" repeatCount="indefinite"/>
</rect>
<g fill="#26316e"><circle cx="290" cy="266" r="3"/><circle cx="330" cy="274" r="3"/><circle cx="362" cy="264" r="3"/></g>
<g fill="#b06634"><circle cx="308" cy="276" r="3"/><circle cx="348" cy="268" r="3"/></g>
</g>
<!-- near depth: the scraper lies flat and does not move; one short shadow, still -->
<polygon points="880,318 1030,306 1036,322 888,336" fill="#b2b4b6"/>
<rect x="852" y="306" width="34" height="26" fill="#6e5232"/>
<ellipse cx="120" cy="352" rx="70" ry="10" fill="#5e462a" opacity="0.55"/>
<rect x="80" y="300" width="86" height="44" fill="#d8b26e"/>
<ellipse cx="123" cy="300" rx="43" ry="13" fill="#e2c482"/>
</svg>
